name = "curso/cardano"
version = "0.0.0"
compiler = "v1.1.21"
plutus = "v3"
license = "Apache-2.0"
description = "Validators del curso de smart contracts (track Cardano)"

[repository]
user = "garbervetsky"
project = "curso-smartcontracts-publico"
platform = "github"

# stdlib fijada en un tag, no en "main": main pide el compilador más nuevo y con
# Aiken v1.1.21 falla al compilarla (sin mensaje de error). v3.1.0 es la de v1.1.21.
[[dependencies]]
name = "aiken-lang/stdlib"
version = "v3.1.0"
source = "github"

# Generadores para property tests (Clases 8 y 9). La v3.0.0 pide Aiken 1.1.24 y
# stdlib v4: con v1.1.21 no compila.
[[dependencies]]
name = "aiken-lang/fuzz"
version = "v2.2.0"
source = "github"
