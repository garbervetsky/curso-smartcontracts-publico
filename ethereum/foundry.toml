[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
# test/halmos/ se corre con `halmos`, no con `forge test`: contra el vault
# vulnerable el invariante falla a proposito.
no_match_path = "test/halmos/*"
# Sin esto, forge >= 1.8 compila los `new X()` de los tests como vm.deployCode(...),
# que halmos no soporta ("Unsupported cheat code: deployCode(string)"), y
# --gas-report muestra el costo de deploy en 0. La 1.7.1 lo acepta y no cambia nada.
dynamic_test_linking = false

# Fuzzing / invariantes (se usan en las Clases 6 y 7)
[fuzz]
runs = 256

[invariant]
runs = 256
depth = 50

# SMTChecker — el verificador formal que ya trae solc (Clase 6).
# Descomentar para verlo en accion. Dos cosas a tener en cuenta:
#   - agrega ~20 s a cada `forge build`; por eso viene comentado
#   - forge cachea: si no cambio ningun .sol hay que forzar con `forge build --force`
# Los `show_*` son necesarios: sin ellos solc dice "4 unsupported language
# feature(s)" pero no dice cuales, y esa es justo la explicacion del falso positivo.
#
# Los DOS solvers a propósito, y el orden importa poco: solc usa el que encuentre.
# En amd64 (labs, y macOS) usa z3, que da el CONTRAEJEMPLO concreto (`amount = 1`).
# En arm64 el solc de aarch64 se compila SIN z3 (0 símbolos: instalar libz3 no
# sirve de nada), así que cae en Eldarica, que la imagen arm64 hornea como `eld`.
# Sin esta línea solc elige z3 y en arm64 el análisis NO CORRE: se ve como
# "Warning (7649): CHC analysis was not possible since no Horn solver was found".
# [profile.default.model_checker]
# contracts        = { "src/Vault.sol" = ["Vault"] }
# engine           = "chc"                          # chc (no acotado) o bmc (acotado)
# solvers          = ["z3", "eld"]
# targets          = ["assert", "overflow", "underflow", "divByZero"]
# timeout          = 20000                          # ms por consulta
# show_unsupported = true                           # que features del lenguaje NO modela
# show_unproved    = true                           # que condiciones no pudo probar
# show_proved_safe = true                           # que condiciones si demostro
